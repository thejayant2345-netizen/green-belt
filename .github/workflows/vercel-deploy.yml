name: Vercel Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it in GitHub repository secrets."
            exit 1
          fi
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: jayantvaibhav
          VERCEL_PROJECT_ID: prj_FFm7IXZziGaiTwT6lUC92KFKMui8
        run: |
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT_ID"
