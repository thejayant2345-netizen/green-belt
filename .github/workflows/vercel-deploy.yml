name: Vercel Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: jayantvaibhav
          VERCEL_PROJECT_ID: prj_FFm7IXZziGaiTwT6lUC92KFKMui8
        run: |
          npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT_ID"
